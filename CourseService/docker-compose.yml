version: '3.8'

services:
  # SQL Server riêng cho Course Service
  course-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: course-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Course@Pass123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - course-sqlserver-data:/var/opt/mssql
    networks:
      - training-center-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Course@Pass123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Course & Schedule Service
  course-service:
    build: .
    container_name: course-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Server=course-sqlserver;Database=CourseDB;User=sa;Password=Course@Pass123;TrustServerCertificate=true
      - JwtSettings__Secret=TrainingCenterSharedSecretKey2024!@#
    depends_on:
      course-sqlserver:
        condition: service_healthy
    networks:
      - training-center-net
    restart: unless-stopped

volumes:
  course-sqlserver-data:

networks:
  training-center-net:
    name: training-center-net
    driver: bridge
