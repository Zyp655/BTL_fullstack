version: '3.8'

services:
  # SQL Server riêng cho Payment Service
  payment-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: payment-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Payment@Pass123
      - MSSQL_PID=Developer
    ports:
      - "1435:1433"
    volumes:
      - payment-sqlserver-data:/var/opt/mssql
    networks:
      - training-center-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Payment@Pass123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Payment & Report Service
  payment-service:
    build: .
    container_name: payment-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Server=payment-sqlserver;Database=PaymentDB;User=sa;Password=Payment@Pass123;TrustServerCertificate=true
      - JwtSettings__Secret=TrainingCenterSharedSecretKey2024!@#
      - ServiceUrls__CourseService=http://course-service:8080
      - ServiceUrls__StudentService=http://student-service:8080
    depends_on:
      payment-sqlserver:
        condition: service_healthy
    networks:
      - training-center-net
    restart: unless-stopped

volumes:
  payment-sqlserver-data:

networks:
  training-center-net:
    name: training-center-net
    driver: bridge
